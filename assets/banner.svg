<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">GitHub Project Publisher</title>
  <desc id="description">A publication preflight for GitHub repositories.</desc>
  <defs>
