      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0f2f4d"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
